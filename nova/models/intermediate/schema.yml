version: 2

models:
  - name: int_geo_country_macro_pivot
    description: "Country-level World Bank macro indicators pivoted into analysis-ready columns."
    columns:
      - name: country_iso3
        tests:
          - unique
          - not_null
      - name: population_total
        tests:
          - not_null
      - name: gdp_per_capita_current_usd
        tests:
          - not_null
      - name: urban_population_pct
        tests:
          - not_null
      - name: internet_users_pct
        tests:
          - not_null
      - name: mobile_subscriptions_per_100_people
        tests:
          - not_null

  - name: int_geo_market_context
    description: "One-row-per-market context model combining Nova market attributes, country metadata, and macro indicators."
    columns:
      - name: market_id
        tests:
          - unique
          - not_null
      - name: country_iso3
        tests:
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
      - name: gdp_per_capita_current_usd
        tests:
          - not_null

  - name: int_geo_date_spine
    description: "Date spine covering the external weather date range, enriched with calendar attributes."
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: year_month
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null

  - name: int_geo_market_category_spine
    description: "Complete market-category-date spine for geography demand modeling."
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_markets')
                field: market_id
      - name: category
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null

  - name: int_geo_market_day_metrics
    description: "Nova transaction metrics aggregated to market and date."
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_markets')
                field: market_id
      - name: order_date
        tests:
          - not_null
      - name: transactions
        tests:
          - not_null
      - name: gmv_usd
        tests:
          - not_null

  - name: int_geo_market_category_day_metrics
    description: "Nova transaction metrics aggregated to market, category, and date."
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_markets')
                field: market_id
      - name: category
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: transactions
        tests:
          - not_null
      - name: gmv_usd
        tests:
          - not_null

  - name: int_geo_market_category_hour_metrics
    description: "Nova transaction metrics aggregated to market, category, and hour of day."
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_markets')
                field: market_id
      - name: category
        tests:
          - not_null
      - name: hour_of_day
        tests:
          - not_null
      - name: transactions
        tests:
          - not_null
      - name: gmv_usd
        tests:
          - not_null

  - name: int_geo_service_supply_by_market_category
    description: "Service supply and service-tier mix by market and category."
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_markets')
                field: market_id
      - name: category
        tests:
          - not_null
      - name: active_services
        tests:
          - not_null
