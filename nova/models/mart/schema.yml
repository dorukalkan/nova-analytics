version: 2

models:
  - name: mart_geo_market_opportunity
    description: "Market-level opportunity ranking for the geography opportunity atlas."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - unique
          - not_null
      - name: opportunity_score
        description: "Composite 0-100 market opportunity score based on current performance, macro potential, supply, and country-level adoption."
        tests:
          - not_null
      - name: opportunity_rank
        description: "Rank by opportunity score, descending."
        tests:
          - not_null
      - name: opportunity_segment
        description: "Business-friendly opportunity segment."
        tests:
          - not_null
      - name: total_transactions
        description: "Total 2024 transactions in the market."
        tests:
          - not_null
      - name: total_gmv_usd
        description: "Total 2024 GMV in USD in the market."
        tests:
          - not_null
      - name: annual_active_users
        description: "Distinct users active in the market during 2024."
        tests:
          - not_null
      - name: country_annual_active_users
        description: "Distinct active users across all Nova markets in the market's country."
        tests:
          - not_null
      - name: market_active_user_penetration
        description: "Market active users divided by country population."
        tests:
          - not_null
      - name: market_urban_active_user_penetration
        description: "Market active users divided by estimated country urban population."
        tests:
          - not_null
      - name: country_active_user_penetration
        description: "Country-level active user penetration, calculated as country active users divided by country population."
        tests:
          - not_null
      - name: country_urban_active_user_penetration
        description: "Country-level active user penetration against estimated urban population."
        tests:
          - not_null
      - name: adoption_score
        description: "0-100 score based on country active-user penetration and urban active-user penetration."
        tests:
          - not_null

  - name: mart_geo_market_category_day_features
    description: "Market-category-day feature table for demand modeling and local demand driver analysis."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - not_null
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: order_date
        description: "Calendar date."
        tests:
          - not_null
      - name: transactions
        description: "Daily transaction target."
        tests:
          - not_null
      - name: gmv_usd
        description: "Daily GMV target in USD."
        tests:
          - not_null
      - name: weather_code
        description: "Open-Meteo daily weather condition code."
        tests:
          - not_null
      - name: is_high_demand_day
        description: "True when transactions are at or above the market/category 75th percentile."
        tests:
          - not_null

  - name: mart_geo_weather_category_sensitivity
    description: "Market-category rain sensitivity and weather correlation summary for dashboard views."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - not_null
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: observed_days
        description: "Number of observed market/category days."
        tests:
          - not_null
      - name: rain_sensitivity_segment
        description: "Business-friendly segment based on rainy vs non-rainy transaction lift."
        tests:
          - not_null

  - name: mart_geo_weather_category_effects
    description: "Dashboard-ready category demand lift summary for broader bad-weather conditions, with all-market and market-level rows."
    columns:
      - name: weather_effect_id
        description: "Unique identifier for the weather effect scope, market, and category."
        tests:
          - unique
          - not_null
      - name: weather_effect_scope
        description: "Whether the row summarizes all markets or one market."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['All Markets', 'Market']
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: observed_days
        description: "Number of market-category-day observations included in the comparison."
        tests:
          - not_null
      - name: bad_weather_days
        description: "Number of observed days flagged as bad weather."
        tests:
          - not_null
      - name: normal_weather_days
        description: "Number of observed days not flagged as bad weather."
        tests:
          - not_null
      - name: bad_weather_sensitivity_segment
        description: "Business-friendly segment based on bad-weather vs normal-weather transaction lift."
        tests:
          - not_null

  - name: mart_geo_category_hourly_demand
    description: "Dashboard-ready hourly demand by market and category for category-by-hour line charts."
    columns:
      - name: market_category_hour_id
        description: "Unique identifier for market, category, and hour of day."
        tests:
          - unique
          - not_null
      - name: market_id
        description: "Nova market identifier."
        tests:
          - not_null
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: hour_of_day
        description: "Hour of day from 0 to 23."
        tests:
          - not_null
      - name: transactions
        description: "Transactions observed in this market, category, and hour."
        tests:
          - not_null

  - name: mart_geo_market_cluster_features
    description: "Market-level feature table for strategic market clustering in the geography dashboard."
    columns:
      - name: market_id
        description: "Nova market identifier. One row per market."
        tests:
          - unique
          - not_null
      - name: market_name
        description: "Human-readable Nova market name."
        tests:
          - not_null
      - name: nova_region
        description: "Nova operating region."
        tests:
          - not_null
      - name: total_transactions
        description: "Total 2024 transactions in the market."
        tests:
          - not_null
      - name: total_gmv_usd
        description: "Total 2024 GMV in USD in the market."
        tests:
          - not_null
      - name: avg_daily_transactions
        description: "Average daily market transactions in 2024."
        tests:
          - not_null
      - name: transaction_growth_rate
        description: "December average daily transactions compared with January average daily transactions."
        tests:
          - not_null
      - name: active_services
        description: "Total active services available in the market across categories."
        tests:
          - not_null
      - name: completion_rate
        description: "Market transaction completion rate."
        tests:
          - not_null
      - name: opportunity_score
        description: "Composite market opportunity score from the opportunity mart."
        tests:
          - not_null
      - name: opportunity_segment
        description: "Opportunity segment from the opportunity mart."
        tests:
          - not_null
      - name: rain_day_share
        description: "Share of market-category-day rows observed on rain days."
        tests:
          - not_null
