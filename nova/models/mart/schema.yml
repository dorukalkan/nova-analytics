version: 2

models:
  - name: mart_geo_market_opportunity
    description: "Market-level opportunity ranking for the geography opportunity atlas."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - unique
          - not_null
      - name: opportunity_score
        description: "Composite 0-100 market opportunity score based on current performance, macro potential, supply, and country-level adoption."
        tests:
          - not_null
      - name: opportunity_rank
        description: "Rank by opportunity score, descending."
        tests:
          - not_null
      - name: opportunity_segment
        description: "Business-friendly opportunity segment."
        tests:
          - not_null
      - name: total_transactions
        description: "Total 2024 transactions in the market."
        tests:
          - not_null
      - name: total_gmv_usd
        description: "Total 2024 GMV in USD in the market."
        tests:
          - not_null
      - name: annual_active_users
        description: "Distinct users active in the market during 2024."
        tests:
          - not_null
      - name: country_annual_active_users
        description: "Distinct active users across all Nova markets in the market's country."
        tests:
          - not_null
      - name: market_active_user_penetration
        description: "Market active users divided by country population."
        tests:
          - not_null
      - name: market_urban_active_user_penetration
        description: "Market active users divided by estimated country urban population."
        tests:
          - not_null
      - name: country_active_user_penetration
        description: "Country-level active user penetration, calculated as country active users divided by country population."
        tests:
          - not_null
      - name: country_urban_active_user_penetration
        description: "Country-level active user penetration against estimated urban population."
        tests:
          - not_null
      - name: adoption_score
        description: "0-100 score based on country active-user penetration and urban active-user penetration."
        tests:
          - not_null

  - name: mart_geo_market_category_day_features
    description: "Market-category-day feature table for demand modeling and local demand driver analysis."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - not_null
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: order_date
        description: "Calendar date."
        tests:
          - not_null
      - name: transactions
        description: "Daily transaction target."
        tests:
          - not_null
      - name: gmv_usd
        description: "Daily GMV target in USD."
        tests:
          - not_null
      - name: weather_code
        description: "Open-Meteo daily weather condition code."
        tests:
          - not_null
      - name: is_high_demand_day
        description: "True when transactions are at or above the market/category 75th percentile."
        tests:
          - not_null

  - name: mart_geo_weather_category_sensitivity
    description: "Market-category rain sensitivity and weather correlation summary for dashboard views."
    columns:
      - name: market_id
        description: "Nova market identifier."
        tests:
          - not_null
      - name: category
        description: "Nova service category."
        tests:
          - not_null
      - name: observed_days
        description: "Number of observed market/category days."
        tests:
          - not_null
      - name: rain_sensitivity_segment
        description: "Business-friendly segment based on rainy vs non-rainy transaction lift."
        tests:
          - not_null

  - name: mart_transaction_fraud_tableau
    description: "Tableau-ready transaction fraud anomaly table enriched with transaction, market, user behavior, and anomaly score fields."
    columns:
      - name: transaction_uuid
        description: "Unique transaction identifier."
        tests:
          - unique
          - not_null
      - name: fraud_anomaly_score
        description: "IsolationForest anomaly score. Higher values indicate more suspicious transactions."
        tests:
          - not_null
      - name: is_suspicious_transaction
        description: "Boolean flag indicating whether the model marked the transaction as anomalous."
        tests:
          - not_null

  - name: mart_customer_overview
    description: "Customer-level overview table combining user attributes with transaction history and revenue metrics."
    columns:
      - name: user_id
        description: "Unique user identifier."
        tests:
          - unique
          - not_null
      - name: membership_tier
        description: "Customer membership tier."
        tests:
          - not_null
      - name: transaction_count
        description: "Total number of distinct transactions for the customer."
        tests:
          - not_null
      - name: completed_transaction_count
        description: "Total number of completed transactions for the customer."
        tests:
          - not_null
      - name: total_revenue
        description: "Completed transaction revenue for the customer."
        tests:
          - not_null

  - name: mart_customer_segments
    description: "Customer segmentation mart based on RFM scores."
    columns:
      - name: user_id
        description: "Unique user identifier."
        tests:
          - unique
          - not_null
      - name: recency_score
        description: "Recency score used for RFM segmentation."
        tests:
          - not_null
      - name: frequency_score
        description: "Frequency score used for RFM segmentation."
        tests:
          - not_null
      - name: monetary_score
        description: "Monetary score used for RFM segmentation."
        tests:
          - not_null
      - name: customer_segment
        description: "Business-friendly customer segment label."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Champions', 'Loyal Customers', 'New Customers', 'Big Spenders', 'At Risk', 'Lost Customers', 'Potential Loyalists']
